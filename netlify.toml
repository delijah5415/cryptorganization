[build]
  # Folder where package.json and your frontend code live
  base = "cryptorganization"
  
  # The command Netlify runs to build your site
  command = "npm run build"
  
  # Directory generated by your build script (e.g., dist, build, .next)
  publish = "dist"

[build.environment]
  # Force Node version to match Netlify build logs
  NODE_VERSION = "22.23.2"

# Directs all client-side routes to index.html (essential for Single Page Apps like React/Vue)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200